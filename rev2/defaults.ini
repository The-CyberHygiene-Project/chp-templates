# Default decision values for the Rev 2 library. Each is a value the CHP appliance ENFORCES, proven by a CUI-profile rule
# that passed in the release scan (idm-assistant lab/iso5/scan-results, ISO 0.2.0-rc2). A site confirms or changes each
# one in its profile.ini; until then the document marks it "(default, not yet confirmed)". Values the appliance does not
# enforce have no default here: the site decides them, and the fill-in report lists them.
[decision]
# scan: accounts_passwords_pam_faillock_deny (var_accounts_passwords_pam_faillock_deny = 3)
lockout_threshold = 3
# scan: accounts_passwords_pam_faillock_unlock_time (var_accounts_passwords_pam_faillock_unlock_time = 0)
lockout_minutes = 0
# scan: accounts_password_pam_minlen (var_password_pam_minlen = 12; local accounts; the identity server's policy is set by the site)
password_min_length = 12
