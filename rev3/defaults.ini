# Default organization-defined parameter (ODP) values for the Rev 3 library: the DoD values from
# "Department of Defense Organization-Defined Parameters for NIST SP 800-171 Revision 3" (memo signed
# April 10, 2025, Attachment A). A site confirms or changes each one in its profile.ini [odp] section; until
# then the document marks it "(default, not yet confirmed)". The four ODPs that DoD defines as guidance
# have no default here: the site sets them, and the fill-in report lists them.

[odp]
# 03.01.01.f.02 [Assignment: organization-defined time period]
03_01_01_f_02 = at most 90 days
# 03.01.01.g.01 [Assignment: organization-defined time period]
03_01_01_g_01 = 24 hours
# 03.01.01.g.02 [Assignment: organization-defined time period]
03_01_01_g_02 = 24 hours
# 03.01.01.g.03 [Assignment: organization-defined time period]
03_01_01_g_03 = 24 hours
# 03.01.01.h.01 [Assignment: organization-defined time period]
03_01_01_h_01 = at most 24 hours
# 03.01.01.h.02 [Assignment: organization-defined circumstances]
03_01_01_h_02 = the work period ends, for privileged users at a minimum
# 03.01.05.b.01 [Assignment: organization-defined security functions]
03_01_05_b_01 = at a minimum and if applicable: establishing system accounts and assigning privileges, configuring access authorizations, configuring settings for events to be audited, establishing vulnerability scanning parameters, establishing intrusion detection parameters, and managing audit information
# 03.01.05.b.02 [Assignment: organization-defined security-relevant information]
03_01_05_b_02 = at a minimum and if applicable: threat and vulnerability information, filtering rules for routers or firewalls, configuration parameters for security services, cryptographic key management information, security architecture, access control lists, and audit information
# 03.01.05.c [Assignment: organization-defined frequency]
03_01_05_c = at least every 12 months
# 03.01.06.a [Assignment: organization-defined personnel or roles]
03_01_06_a = only defined and authorized personnel or administrative roles
# 03.01.08.a.01 [Assignment: organization-defined number]
03_01_08_a_01 = at most five (5)
# 03.01.08.a.02 [Assignment: organization-defined time period]
03_01_08_a_02 = period of five (5) minutes
# 03.01.08.b [Assignment: organization-defined time period]
03_01_08_b = [Selection (one or more): lock the account or node for an at least 15-minute time period; lock the account or node until released by an administrator and notify a system administrator]
# 03.01.10.a [Assignment: organization-defined time period]
03_01_10_a = initiating a device lock after “at most 15 minutes” of inactivity and requiring the user to initiate a device lock before leaving the system unattended
# 03.01.11 [Assignment: organization-defined conditions or trigger events requiring session disconnect]
03_01_11 = a specified duration (maximum of 24 hours) of inactivity, misbehavior (end the session due to an attempted policy violation), and maintenance (terminate sessions to prevent issues with an upgrade or service outage)
# 03.02.01.a.01 [Assignment: organization-defined frequency]
03_02_01_a_01 = at least every 12 months
# 03.02.01.a.02 [Assignment: organization-defined events]
03_02_01_a_02 = significant, novel incidents, or significant changes to risks
# 03.02.01.b.01 [Assignment: organization-defined frequency]
03_02_01_b_01 = at least every 12 months
# 03.02.01.b.02 [Assignment: organization-defined events]
03_02_01_b_02 = significant, novel incidents, or significant changes to risks
# 03.02.02.a.01 [Assignment: organization-defined frequency]
03_02_02_a_01 = at least every 12 months
# 03.02.02.a.02 [Assignment: organization-defined events]
03_02_02_a_02 = significant, novel incidents, or significant changes to risks
# 03.02.02.b.01 [Assignment: organization-defined frequency]
03_02_02_b_01 = at least every 12 months
# 03.02.02.b.02 [Assignment: organization-defined events]
03_02_02_b_02 = significant, novel incidents, or significant changes to risks
# 03.03.01.a [Assignment: organization-defined event types]
03_03_01_a = at a minimum and where applicable: 1) Authentication events: a) Logons (Success/Failure) b) Logoffs (Success) 2) Security Relevant File and Objects events: a) Create (Success/Failure) b) Access (Success/Failure) c) Delete (Success/Failure) d) Modify (Success/Failure) e) Permission Modification (Success/Failure) f) Ownership Modification (Success/Failure) 3) Export/Writes/downloads to devices/digital media (e.g., CD/DVD, USB, SD) (Success/Failure) 4) Import/Uploads from devices/digital media (e.g., CD/DVD, USB, SD) (Success/Failure) 5) User and Group Management events: a) User add, delete, modify, disable, lock (Success/Failure) b) Group/Role add, delete, modify (Success/Failure) 6) Use of Privileged/Special Rights events: a) Security or audit policy changes (Success/Failure) b) Configuration changes (Success/Failure) 7) Admin or root-level access (Success/Failure) 8) Privilege/Role escalation (Success/Failure) 9) Audit and security relevant log data accesses (Success/Failure) 10) System reboot, restart, and shutdown (Success/Failure) 11) Print to a device (Success/Failure) 12) Print to a file (e.g., pdf format) (Success/Failure) 13) Application (e.g., Adobe, Firefox, MS Office Suite) initialization (Success/Failure) For additional guidance, see: OMB21-31 ML 1
# 03.03.01.b [Assignment: organization-defined frequency]
03_03_01_b = at least every 12 months and after any significant incidents or significant changes to risks
# 03.03.04.a [Assignment: organization-defined time period]
03_03_04_a = near real time or as soon as practicable upon discovery
# 03.03.04.b [Assignment: organization-defined additional actions]
03_03_04_b = document the failure and resolution, troubleshoot, repair/restart the audit logging process, and report as incident if applicable
# 03.03.05.a [Assignment: organization-defined frequency]
03_03_05_a = at least weekly
# 03.03.07.b [Assignment: organization-defined granularity of time measurement]
03_03_07_b = a granularity of one (1) second or smaller
# 03.04.01.b [Assignment: organization-defined frequency]
03_04_01_b = at least every 12 months and after any significant incidents or significant changes occur
# 03.04.02.a [Assignment: organization-defined configuration settings]
03_04_02_a = Apply the appropriate use of common security configurations available from the National Institute of Standards and Technology’s National Checklist Program (NCP) website (https://ncp.nist.gov/repository) and prevent remote devices from simultaneously establishing non-remote connections with organizational systems and communicating via some other unauthorized connection to resources in external networks. Document any deviations from the published standard or source document.
# 03.04.06.c [Assignment: organization-defined frequency]
03_04_06_c = at least every 12 months, when any system functions, ports, protocols, or services changes are made, and after any significant incidents or significant changes to risks
# 03.04.08.c [Assignment: organization-defined frequency]
03_04_08_c = at least quarterly
# 03.04.10.b [Assignment: organization-defined frequency]
03_04_10_b = at least quarterly
# 03.04.12.a [Assignment: organization-defined system configurations]
03_04_12_a = a configuration that has no CUI or FCI stored on the system and prevents the processing, storing, and transmission of CUI and FCI, unless a specific exception is granted in writing by the Contracting Officer
# 03.04.12.b [Assignment: organization-defined security requirements]
03_04_12_b = examine the system for signs of physical tampering and take the appropriate actions, and then either purge and reimage all storage media or destroy the system
# 03.05.01.b [Assignment: organization-defined circumstances or situations requiring re-authentication]
03_05_01_b = roles, authenticators, or credentials change (including modification of user privilege); when security categories of systems change; when the execution of privileged functions occurs; and after a session termination
# 03.05.02 [Assignment: organization-defined devices or types of devices]
03_05_02 = all devices for identification, where feasible for authentication, and document when not feasible
# 03.05.05.c [Assignment: organization-defined time period]
03_05_05_c = at least ten (10) years
# 03.05.05.d [Assignment: organization-defined characteristic identifying individual status]
03_05_05_d = privileged or non-privileged users; contractors, foreign nationals, and/or non-organizational users
# 03.05.07.a [Assignment: organization-defined frequency]
03_05_07_a = at least quarterly
# 03.05.07.f [Assignment: organization-defined composition and complexity rules]
03_05_07_f = 1) Must have a minimum length of 16 characters. 2) Contains a string of characters that does not include the user’s account name or full name.
# 03.05.12.e.01 [Assignment: organization-defined frequency]
03_05_12_e_01 = never for passwords where MFA is employed, at least every five (5) years for hard tokens and identification badges, and at least every three (3) years for all other authenticators
# 03.05.12.e.02 [Assignment: organization-defined events]
03_05_12_e_02 = after a relevant security incident or any evidence of compromise or loss
# 03.06.02.b [Assignment: organization-defined time period]
03_06_02_b = near real time or as soon as practicable upon discovery
# 03.06.02.c [Assignment: organization-defined authorities]
03_06_02_c = all applicable personnel and entities as specified by the contract, and in accordance with any incident response plan notification procedures
# 03.06.03 [Assignment: organization-defined frequency]
03_06_03 = at least every 12 months
# 03.06.04.a.01 [Assignment: organization-defined time period]
03_06_04_a_01 = ten (10) days for privileged users, thirty (30) days for all other roles
# 03.06.04.a.03 [Assignment: organization-defined frequency]
03_06_04_a_03 = at least every 12 months
# 03.06.04.b.01 [Assignment: organization-defined frequency]
03_06_04_b_01 = at least every 12 months
# 03.06.04.b.02 [Assignment: organization-defined events]
03_06_04_b_02 = significant, novel incidents, or significant changes to risks
# 03.08.07.a [Assignment: organization-defined types of system media]
03_08_07_a = any removable media not managed by or on behalf of the organization
# 03.09.01.b [Assignment: organization-defined conditions requiring rescreening]
03_09_01_b = an organizational policy requiring rescreening when there is a significant incident, or change in status, related to an individual
# 03.09.02.a.01 [Assignment: organization-defined time period]
03_09_02_a_01 = four (4) hours
# 03.10.01.c [Assignment: organization-defined frequency]
03_10_01_c = at least every 12 months, or when there are significant incidents or significant changes to risks
# 03.10.02.b.01 [Assignment: organization-defined frequency]
03_10_02_b_01 = at least every 45 days
# 03.10.02.b.02 [Assignment: organization-defined events or potential indications of events]
03_10_02_b_02 = significant, novel incidents, or significant changes to risks
# 03.10.06.b [Assignment: organization-defined security requirements]
03_10_06_b = adequate security, comparable to organizational security requirements at the primary work site where practical, documented in policy, and covered by training
# 03.11.01.b [Assignment: organization-defined frequency]
03_11_01_b = at least every 12 months, or when there are significant incidents or significant changes to risks
# 03.11.02.a [Assignment: organization-defined frequency]
03_11_02_a = at least monthly, or when there are significant incidents or significant changes to risks
# 03.11.02.b [Assignment: organization-defined response times]
03_11_02_b = thirty (30) days from date of discovery for high-risk vulnerabilities (including both critical and high); 90 days from date of discovery for moderate-risk vulnerabilities; and 180 days from date of discovery for low-risk vulnerabilities
# 03.11.02.c [Assignment: organization-defined frequency]
03_11_02_c = no more than 24 hours prior to running the scans
# 03.12.01 [Assignment: organization-defined frequency]
03_12_01 = at least every 12 months, or when there are significant incidents or significant changes to risks
# 03.12.05.a [Selection (one or more): interconnection security agreements; information exchange security agreements; memoranda of understanding or agreement; service-level agreements; user agreements; nondisclosure agreements; other types of agreements]
03_12_05_a = requirements as described in the contract
# 03.12.05.c [Assignment: organization-defined frequency]
03_12_05_c = at least every 12 months
# 03.13.09 [Assignment: organization-defined time period]
03_13_09 = no longer than 15 minutes
# 03.13.11 [Assignment: organization-defined types of cryptography]
03_13_11 = FIPS Validated Cryptography (https://csrc.nist.gov/Projects/Cryptographic-Module-Validation-Program/Validated-Modules)
# 03.13.12.a [Assignment: organization-defined exceptions where remote activation is to be allowed]
03_13_12_a = only as enumerated and justified in the System Security Plan before such remote activation occurs, and only when there are no other options, and the remote activation is operationally critical
# 03.14.01.b [Assignment: organization-defined time period]
03_14_01_b = thirty (30) days for high-risk flaws (including both critical and high), 90 days for moderate-risk flaws, and 180 days for low-risk flaws
# 03.14.02.c.01 [Assignment: organization-defined frequency]
03_14_02_c_01 = at least weekly
# 03.15.01.b [Assignment: organization-defined frequency]
03_15_01_b = at least every 12 months, or when there are significant incidents or significant changes to risks
# 03.15.02.b [Assignment: organization-defined frequency]
03_15_02_b = at least every 12 months, or when there are significant incidents or significant changes to risks
# 03.15.03.d [Assignment: organization-defined frequency]
03_15_03_d = at least every 12 months, or when there are significant incidents or significant changes to risks
# 03.16.03.a [Assignment: organization-defined security requirements]
03_16_03_a = 1. For cloud service providers: (i) FedRAMP Authorized at the FedRAMP Moderate (or higher) baseline in accordance with the FedRAMP Marketplace; or (ii) meets security requirements established by the government equivalent to the FedRAMP Moderate (or higher) baseline. 2. All other external service providers must meet NIST SP 800-171 R2.
# 03.17.01.b [Assignment: organization-defined frequency]
03_17_01_b = at least every 12 months, or when there are significant incidents or significant changes to risks
# 03.17.03.b [Assignment: organization-defined security requirements]
03_17_03_b = at a minimum, integrate Supply Chain Risk Management (SCRM) into acquisition/procurement policies, provide adequate SCRM resources, define the SCRM control baseline, establish processes to ensure suppliers disclose significant vulnerabilities and significant incidents
